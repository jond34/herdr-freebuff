name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      # Every host the manifest claims: both architectures on Linux, both on
      # macOS. macos-15-intel is the x64 image; macos-latest is arm64.
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Host capabilities
        run: |
          uname -s
          node --version
          command -v lsof || true

      - name: Shell syntax
        run: |
          sh -n scripts/common.sh
          sh -n scripts/launch.sh
          sh -n scripts/doctor.sh
          sh -n scripts/new-task.sh
          sh -n tests/run.sh

      - name: JavaScript syntax
        run: |
          node --check scripts/status-watcher.js
          node --check tests/watcher.test.js
          node --check tests/new-task.test.js

      - name: Watcher tests
        run: sh tests/run.sh

      - name: Secret and local-path scan
        run: |
          set -eu
          if git grep -nE 'BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]+' -- . ':!*.yml'; then
            echo "possible secret material" >&2
            exit 1
          fi
          if git grep -nE '/(home|Users)/[^/[:space:]]+' -- . ':!*.yml'; then
            echo "absolute home path in tracked files" >&2
            exit 1
          fi

      # The repository is the artifact: planning vocabulary and pointers to
      # gitignored files mean nothing to someone who cloned it.
      - name: Shipped files carry no internal jargon
        run: |
          set -eu
          if git grep -nIE 'phase[ _-]?[0-9]|\bP[1-9]\b' -- . ':!*.yml'; then
            echo "planning vocabulary in a tracked file" >&2
            exit 1
          fi
          if git grep -nIE 'PLAN\.md|scratch/' -- . ':!*.yml' ':!.gitignore'; then
            echo "reference to an unpublished path in a tracked file" >&2
            exit 1
          fi
