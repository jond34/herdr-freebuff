name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      # Every host the manifest claims: both architectures on Linux, both on
      # macOS. macos-15-intel is the x64 image; macos-latest is arm64.
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Host capabilities
        run: |
          uname -s
          node --version
          command -v lsof || true

      - name: Shell syntax
        run: |
          sh -n scripts/common.sh
          sh -n scripts/launch.sh
          sh -n scripts/doctor.sh
          sh -n scripts/new-task.sh
          sh -n tests/run.sh

      - name: JavaScript syntax
        run: |
          node --check scripts/status-watcher.js
          node --check scripts/watcher/binding.js
          node --check scripts/watcher/turns.js
          node --check scripts/watcher/herdr.js
          node --check scripts/watcher/doctor.js
          node --check scripts/platform/index.js
          node --check scripts/platform/unix.js
          node --check scripts/platform/windows.js
          node --check tests/watcher.test.js
          node --check tests/new-task.test.js

      - name: Watcher tests
        run: sh tests/run.sh

      - name: Secret and local-path scan
        run: |
          set -eu
          if git grep -nE 'BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]+' -- . ':!*.yml'; then
            echo "possible secret material" >&2
            exit 1
          fi
          if git grep -nE '/(home|Users)/[^/[:space:]]+' -- . ':!*.yml'; then
            echo "absolute home path in tracked files" >&2
            exit 1
          fi

      # The repository is the artifact: planning vocabulary and pointers to
      # gitignored files mean nothing to someone who cloned it.
      - name: Shipped files carry no internal jargon
        run: |
          set -eu
          if git grep -nIE 'phase[ _-]?[0-9]|\bP[1-9]\b' -- . ':!*.yml'; then
            echo "planning vocabulary in a tracked file" >&2
            exit 1
          fi
          if git grep -nIE 'PLAN\.md|scratch/' -- . ':!*.yml' ':!.gitignore'; then
            echo "reference to an unpublished path in a tracked file" >&2
            exit 1
          fi

  # The shell suite drives launch.sh with a fake process tree, which is the part
  # of the plugin Windows does not have; this job covers what Windows does have:
  # the seam, the binding rules, the manifest twins, and parsing of every
  # PowerShell entrypoint. A live pane is not started here, because Herdr and
  # Freebuff are not installed on the runner.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript syntax
        shell: powershell
        run: |
          node --check scripts/status-watcher.js
          node --check scripts/watcher/binding.js
          node --check scripts/watcher/turns.js
          node --check scripts/watcher/herdr.js
          node --check scripts/watcher/doctor.js
          node --check scripts/platform/index.js
          node --check scripts/platform/unix.js
          node --check scripts/platform/windows.js
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: PowerShell syntax
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts/windows/*.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            foreach ($error in $errors) {
              Write-Host "$($_.Name):$($error.Extent.StartLineNumber): $($error.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Platform and manifest tests
        shell: powershell
        run: |
          node --test --test-concurrency=1 tests/platform.test.js tests/manifest.test.js
          if ($LASTEXITCODE -ne 0) { exit 1 }
