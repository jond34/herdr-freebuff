id = "freebuff.integration"
name = "Freebuff"
version = "0.2.1"
min_herdr_version = "0.9.5"
description = "Launch Freebuff inside Herdr with live agent status, notifications, chat binding, and session restore."
platforms = ["linux", "macos", "windows"]

# Freebuff's TUI needs a real PTY, so it runs in a plugin pane rather than an
# action or CLI call. Herdr keybindings can only invoke plugin actions, not
# panes, so the `new-task` action below opens the pane for `prefix+f`:
#   herdr plugin pane open --plugin freebuff.integration --entrypoint task

# Commands normally run with the plugin directory as their working directory,
# but a pane opened with an explicit cwd runs there instead. Resolve the script
# through HERDR_PLUGIN_ROOT so both paths work and Freebuff still starts in the
# pane's directory.
#
# Each entrypoint appears once per host family, because the launcher differs: a
# shell script on Linux and macOS, a PowerShell script on Windows. Herdr 0.9.5
# requires an id to be unique across the whole manifest, so the Windows entries
# carry a `-windows` suffix; `platforms` decides which entry a host may open.
# The status watcher is the same Node file everywhere.

[[panes]]
id = "task"
title = "Freebuff"
placement = "split"
platforms = ["linux", "macos"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/scripts/launch.sh\" task"]

[[panes]]
id = "task-windows"
title = "Freebuff"
placement = "split"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "& \"$env:HERDR_PLUGIN_ROOT/scripts/windows/launch.ps1\" task"]

[[panes]]
id = "resume-last"
title = "Freebuff (last chat)"
placement = "split"
platforms = ["linux", "macos"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/scripts/launch.sh\" resume-last"]

[[panes]]
id = "resume-last-windows"
title = "Freebuff (last chat)"
placement = "split"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "& \"$env:HERDR_PLUGIN_ROOT/scripts/windows/launch.ps1\" resume-last"]

[[actions]]
id = "doctor"
title = "Freebuff: doctor"
contexts = ["pane"]
platforms = ["linux", "macos"]
command = ["sh", "scripts/doctor.sh"]

[[actions]]
id = "doctor-windows"
title = "Freebuff: doctor"
contexts = ["pane"]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "& \"$env:HERDR_PLUGIN_ROOT/scripts/windows/doctor.ps1\""]

# Herdr keybindings can only invoke plugin actions. This action opens the
# `task` pane through the CLI, so `prefix+f` can start Freebuff directly. The
# script passes the invoking pane's directory as --cwd, because plugin commands
# otherwise run in the plugin directory and Freebuff would key its chats there.
[[actions]]
id = "new-task"
title = "Freebuff: new task"
platforms = ["linux", "macos"]
command = ["sh", "scripts/new-task.sh"]

[[actions]]
id = "new-task-windows"
title = "Freebuff: new task"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "& \"$env:HERDR_PLUGIN_ROOT/scripts/windows/new-task.ps1\""]

# A `freebuff` you start by hand never reports itself, so Herdr cannot list it
# as an agent. This registers the focused pane as a Freebuff agent without
# claiming a status.
#
# Why Herdr cannot detect it instead: Herdr names an agent from the pane's
# foreground command text and looks that name up in a closed `Agent` enum
# (`src/detect/mod.rs` in Herdr). Detection manifests only supply state rules
# for a kind that already exists in that enum, and local overrides
# (`~/.config/herdr/agent-detection/<agent>.toml`) cannot add a kind. Freebuff
# is not in the enum, so no manifest can make Herdr recognise it. Automatic
# detection needs an upstream Herdr change; see the README section "Why this is
# manual".
[[actions]]
id = "register-pane"
title = "Freebuff: register this pane"
contexts = ["pane"]
platforms = ["linux", "macos"]
command = ["sh", "scripts/register-pane.sh"]

[[actions]]
id = "register-pane-windows"
title = "Freebuff: register this pane"
contexts = ["pane"]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "& \"$env:HERDR_PLUGIN_ROOT/scripts/windows/register-pane.ps1\""]
