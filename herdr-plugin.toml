id = "freebuff.integration"
name = "Freebuff"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Launch Freebuff inside Herdr with lifecycle, chat attribution, and session restore."
platforms = ["linux"]

# Freebuff's TUI needs a real PTY, so it runs in a plugin pane rather than an
# action or CLI call. Herdr keybindings can only invoke plugin actions, not
# panes, so the `new-task` action below opens the pane for `prefix+f`:
#   herdr plugin pane open --plugin freebuff.integration --entrypoint task

# Commands normally run with the plugin directory as their working directory,
# but a pane opened with an explicit cwd runs there instead. Resolve the script
# through HERDR_PLUGIN_ROOT so both paths work and Freebuff still starts in the
# pane's directory.

[[panes]]
id = "task"
title = "Freebuff"
placement = "split"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/scripts/launch.sh\" task"]

[[panes]]
id = "resume-last"
title = "Freebuff (last chat)"
placement = "split"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/scripts/launch.sh\" resume-last"]

[[actions]]
id = "doctor"
title = "Freebuff: doctor"
contexts = ["pane"]
command = ["sh", "scripts/doctor.sh"]

# Herdr keybindings can only invoke plugin actions. This action opens the
# `task` pane through the CLI, so `prefix+f` can start Freebuff directly.
[[actions]]
id = "new-task"
title = "Freebuff: new task"
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin freebuff.integration --entrypoint task --placement split --focus"]

# A `freebuff` you start by hand never reports itself, so Herdr cannot list it
# as an agent. This registers the focused pane as a Freebuff agent without
# claiming a status.
[[actions]]
id = "register-pane"
title = "Freebuff: register this pane"
contexts = ["pane"]
command = ["sh", "scripts/register-pane.sh"]
