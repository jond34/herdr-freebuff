id = "freebuff.integration"
name = "Freebuff"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Launch Freebuff inside Herdr with lifecycle, chat attribution, and session restore."
platforms = ["linux"]

# Freebuff's TUI needs a real PTY, so it runs in a plugin pane rather than an
# action or CLI call. Bind this entrypoint to a key in the Herdr config:
#   [[keys.command]]
#   key = "prefix+f"
#   type = "plugin_pane"
#   command = "freebuff.integration.task"
#   description = "Freebuff: new task"

# Commands normally run with the plugin directory as their working directory,
# but a pane opened with an explicit cwd runs there instead. Resolve the script
# through HERDR_PLUGIN_ROOT so both paths work and Freebuff still starts in the
# pane's directory.

[[panes]]
id = "task"
title = "Freebuff"
placement = "split"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/scripts/launch.sh\" task"]

[[panes]]
id = "resume-last"
title = "Freebuff (last chat)"
placement = "split"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/scripts/launch.sh\" resume-last"]

[[actions]]
id = "doctor"
title = "Freebuff: doctor"
contexts = ["pane"]
command = ["sh", "scripts/doctor.sh"]
